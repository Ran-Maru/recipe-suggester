catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  vitest: 5.1.0
  "@vitest/browser-playwright": 5.1.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # stylelint 18 に、peer が 17 までの CSS Modules 関連を載せる。
    # stylelint-config-css-modules、@css-modules-kit/stylelint-plugin、
    # その推移依存の stylelint-scss。上流が 18 を宣言したら外す。
    stylelint: "18"
