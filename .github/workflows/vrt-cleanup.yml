name: Visual Regression Cleanup

run-name: 見た目の比較の掃除 #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  cleanup:
    # fork と Dependabot の PR ではシークレットが渡らず、レポートも載せていない。
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Delete reports from Cloudflare
        env:
          VRT_WORKER_URL: ${{ vars.VRT_WORKER_URL }}
          VRT_UPLOAD_TOKEN: ${{ secrets.VRT_UPLOAD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/vrt/delete-reports.sh
