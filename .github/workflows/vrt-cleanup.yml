name: Visual Regression Cleanup

run-name: 見た目の比較の掃除 #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  cleanup:
    # fork と Dependabot の PR ではトークンが読み取り専用になる。それらの artifact は期限で消える。
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Delete visual regression artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/vrt/cleanup.sh
