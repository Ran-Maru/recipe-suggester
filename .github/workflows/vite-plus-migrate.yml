# Renovate が renovate/vite-plus を開いたあと、対象版のグローバル CLI で vp migrate する。
# push は VP_MIGRATE_PUSH_TOKEN（contents の読み書きができる fine-grained PAT）。
# GITHUB_TOKEN の push では pull_request が再発火せず、Tests が migrate 後のコミットを見ない。
# 差分が無いときは Tests を手動起動する。Renovate の最初のコミットでは test がスキップされるため。
name: Vite+ migrate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: vite-plus-migrate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate:
    name: Run vp migrate
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.ref == 'renovate/vite-plus' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the Renovate branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.VP_MIGRATE_PUSH_TOKEN }}
          persist-credentials: true

      - name: Read the target version
        id: gate
        run: |
          set -euo pipefail
          version="$(bash scripts/vp-migrate-renovate.sh version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if bash scripts/vp-migrate-renovate.sh already-applied; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the target global CLI
        if: steps.gate.outputs.skip != 'true'
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: ${{ steps.gate.outputs.version }}
          node-version-file: ".node-version"
          run-install: false

      - name: vp migrate
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/vp-migrate-renovate.sh apply

      - name: Commit and push when migrate changed files
        id: commit
        if: steps.gate.outputs.skip != 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" != "renovate/vite-plus" ]]; then
            echo "対象外のブランチです: ${HEAD_REF}" >&2
            exit 1
          fi
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "差分はありません"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subject="$(bash scripts/vp-migrate-renovate.sh commit-subject)"
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "$subject"
          git push origin "HEAD:${HEAD_REF}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Start Tests when migrate made no commit
        if: steps.gate.outputs.skip != 'true' && steps.commit.outputs.pushed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$HEAD_REF"
