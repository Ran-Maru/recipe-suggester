# レシピ追加だけの PR を、CI 成功後に main へ squash マージする。
# デプロイ自体は ci.yml の pages が、その main への push の CI 成功後に行う。
#
# 判定スクリプトは main のものを使う。PR のコードは checkout も実行もしない。
# workflow_run は既定ブランチのワークフロー定義で動く。
# 下書きはマージしない。Ready for review の時点で、そのコミットの CI が
# 既に成功していれば、テストをやり直さずにマージする。
name: Auto-merge recipe additions

on:
  workflow_run:
    workflows: ["Tests & Dependabot Auto Merge"]
    types: [completed]
  pull_request_target:
    types: [ready_for_review]
    branches: [main]

# レシピ PR が重なったとき、マージは1件ずつ行う。進行中のマージは取り消さない。
concurrency:
  group: recipe-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge when the diff only adds recipes
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) || (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.pull_request.author_association == 'OWNER' ||
          github.event.pull_request.author_association == 'MEMBER' ||
          github.event.pull_request.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - name: レシピ追加だけならマージする
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          CI_TRUSTED: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/merge-recipe-additions-pr.sh
