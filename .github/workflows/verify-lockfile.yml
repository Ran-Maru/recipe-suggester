# actions.lock がワークフローとずれているとき、または pin した commit を上流で確認できないときに失敗する。
name: Verify actions lockfile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # 版は gh-actions-lock のリリース。renovate.json5 の constraints.ghActionsLock と揃える。
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify actions.lock
        run: gh actions-lock --verify
