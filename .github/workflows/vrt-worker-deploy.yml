name: Visual Regression Worker Deploy

on:
  push:
    branches: [main]
    paths:
      - "workers/vrt/**"
      - ".github/workflows/vrt-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vrt-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare settings
        id: settings
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID がないので、デプロイしません（未設定）。"
          fi

      - uses: actions/checkout@v7
        if: steps.settings.outputs.enabled == 'true'

      # UPLOAD_TOKEN は Worker のシークレットに入れる。アップロード側（vrt.yml）の VRT_UPLOAD_TOKEN と同じ値にする。
      - name: Deploy Worker
        if: steps.settings.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        env:
          UPLOAD_TOKEN: ${{ secrets.VRT_UPLOAD_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/vrt
          secrets: |
            UPLOAD_TOKEN
