name: Knip and similarity-ts

on:
  schedule:
    # 金曜 21:00 JST（12:00 UTC）。隔週かどうかは gate で判定する。
    - cron: "0 12 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Biweekly gate
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
      # 起点と隔週の計算は scripts/biweekly-gate.ts。
      - name: Decide whether to run the audit
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          NODE_NO_WARNINGS: "1"
        run: node --experimental-strip-types scripts/biweekly-gate.ts

  knip:
    name: knip
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: true
      - name: Run knip
        run: vp exec knip --reporter github-actions

  similarity:
    name: similarity-ts
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install similarity-ts
        env:
          SIMILARITY_DIR: ${{ runner.temp }}/similarity
        run: |
          bash scripts/install-similarity-ts.sh "$SIMILARITY_DIR"
          echo "$SIMILARITY_DIR" >> "$GITHUB_PATH"
      - name: Run similarity-ts
        # routeTree.gen.ts は TanStack Router の生成物で、型の並びが意図的に似ている。
        run: >-
          similarity-ts src --print --fail-on-duplicates
          --exclude src/routeTree.gen.ts
