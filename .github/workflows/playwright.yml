name: Playwright Tests & Dependabot Auto Merge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: true
      - name: Check Lint Rules, TypeScript Errors, And Mapping Json File Errors
        run: vp run check
      - name: Check Build
        run: vp build
      - name: Install Playwright Browsers
        run: vp exec playwright install --with-deps chromium webkit
      - name: Run Playwright tests
        run: vp exec playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ブランチの保護ルール（特定CI Checkを必須化） + `gh pr merge --auto --merge "$PR_URL"` で対応する方法もあった。
  # しかしブランチ保護ルールはPrivate Repositoryでは有料プランでしか使えないため、この方式を採用した。
  dependabot-auto-merge:
    needs: test
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Dependabot metadata取得
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: マージ実行(minor/patchのみの場合、マージする。)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
