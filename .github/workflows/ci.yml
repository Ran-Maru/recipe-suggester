name: Tests & Dependabot Auto Merge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: true
      - name: Check Lint Rules, TypeScript Errors, And Mapping Json File Errors
        run: vp run check
      - name: Check Build
        run: vp run build
      # ブラウザのバイナリは ~/.cache/ms-playwright に入る。中身は Playwright のバージョンで決まる。
      # OS のパッケージはランナーに入るのでキャッシュできない。導入は毎回行う。
      # 導入とブラウザの取得は同時に走らせる。キャッシュがあるときは取得だけすぐ終わる。
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(vp exec playwright --version)"
          version="${version#Version }"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.]+)?$ ]]; then
            echo "Playwright のバージョンを読めませんでした: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-browsers-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Browsers
        run: |
          set -euo pipefail
          deps_log="$RUNNER_TEMP/playwright-deps.log"
          vp exec playwright install-deps chromium webkit > "$deps_log" 2>&1 &
          deps_pid=$!
          install_status=0
          vp exec playwright install chromium webkit || install_status=$?
          deps_status=0
          wait "$deps_pid" || deps_status=$?
          cat "$deps_log"
          if [[ "$install_status" -ne 0 ]]; then
            exit "$install_status"
          fi
          exit "$deps_status"
      # 同じキーが既にある（並行ジョブが先に保存した、fork の PR で書き込めない）ときは失敗する。
      # テストとは別なので、保存の失敗ではジョブを落とさない。
      - name: Save Playwright browsers
        if: success() && steps.playwright-browsers-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-browsers-cache.outputs.cache-primary-key }}
      - name: Run Vitest
        run: vp test
      - name: Run Playwright tests
        run: vp exec playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # シェルスクリプトは ShellCheck、ワークフローは actionlint。
  # actionlint は同じ ShellCheck で run: のスクリプトも見る。
  # 版とチェックサムは scripts/install-ci-linters.sh。
  lint:
    name: ShellCheck and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck and actionlint
        env:
          LINT_TOOL_DIR: ${{ runner.temp }}/lint-tools
        run: |
          bash scripts/install-ci-linters.sh "$LINT_TOOL_DIR"
          export PATH="${LINT_TOOL_DIR}:${PATH}"
          bash scripts/lint-shell-and-workflows.sh

  # ブランチの保護ルール（特定CI Checkを必須化） + `gh pr merge --auto --merge "$PR_URL"` で対応する方法もあった。
  # しかしブランチ保護ルールはPrivate Repositoryでは有料プランでしか使えないため、この方式を採用した。
  dependabot-auto-merge:
    needs: [test, lint]
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Dependabot metadata取得
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # vite-plus グループはパッチでも型・設定 API が壊れやすい（dependabot.yml / #63）。
      # && は || より優先されるため、update-type の判定は括弧でまとめる。
      - name: マージ実行(minor/patchのみ。vite-plus グループは除く)
        if: |
          steps.metadata.outputs.dependency-group != 'vite-plus' &&
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          )
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # main への push では、test と lint が成功してから GitHub Pages へデプロイする。
  # レシピ追加だけの PR は recipe-auto-merge.yml が squash マージし、その push でここがデプロイする。
  # それ以外の PR ではデプロイしない。同じ内容の出し直しは gh-pages-deploy.yml の手動実行。
  pages:
    name: Deploy to GitHub Pages
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/gh-pages-deploy.yml
