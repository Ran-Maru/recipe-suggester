# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      day: "friday"
      time: "20:00"

    # 失敗しやすい系統は other から外し、関連パッケージだけまとめる。
    # other に混ぜると 1 件の破壊的更新で週次バッチ全体が落ちる（#100）。
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@vitejs/plugin-react"
      # Vite+ が vitest をピン留めしている。provider だけ major が上がると設定解決が壊れる。
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "vitest-browser-react"
      # ツールチェーン本体。パッチでも型・設定 API が壊れやすい（#63）。
      vite-plus:
        patterns:
          - "vite-plus"
          - "vite"
      # ブラウザバイナリと @playwright/test は同じバージョンに揃える。
      playwright:
        patterns:
          - "playwright"
          - "@playwright/test"
      # typescript は TS6 alias、typescript-7 は TS7。片方だけ major が上がると構成が崩れる。
      typescript:
        patterns:
          - "typescript"
          - "typescript-7"
      # 0.x のため minor でも破壊的になり得る。React compiler 用。
      oxc:
        patterns:
          - "oxc-transform-react"
      other:
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@vitejs/plugin-react"
          - "vitest"
          - "@vitest/*"
          - "vitest-browser-react"
          - "vite-plus"
          - "vite"
          - "playwright"
          - "@playwright/test"
          - "typescript"
          - "typescript-7"
          - "oxc-transform-react"
    ignore:
      # @types/nodeのメジャーバージョンはnode.jsのバージョンに依存するため、メジャーバージョンアップデートは無視する。
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      day: "friday"
      time: "20:00"
    cooldown:
      default-days: 3
